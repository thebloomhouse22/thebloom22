    /* =====================================================
       PURPLE BLOOM BACKGROUND
       ===================================================== */

    .bloom-background {

      position: fixed;

      inset: 0;

      z-index: -10;

      pointer-events: none;

      overflow: hidden;

      background:

        radial-gradient(
          circle at 50% 15%,
          rgba(124,58,237,0.18),
          transparent 30%
        ),

        radial-gradient(
          circle at 10% 60%,
          rgba(168,85,247,0.08),
          transparent 25%
        ),

        #09040f;

    }


    .bloom {

      position: absolute;

      width: 450px;
      height: 450px;

      left: 50%;
      top: 20%;

      transform:
        translate(-50%,-50%);

      border-radius: 50%;

      background:

        radial-gradient(
          circle,
          rgba(168,85,247,0.55),
          rgba(124,58,237,0.16) 45%,
          transparent 72%
        );

      filter: blur(35px);

      animation:
        bloomPulse 8s ease-in-out infinite;

    }


    .bloom::before {

      content: "";

      position: absolute;

      inset: 10%;

      border-radius: 50%;

      background:

        radial-gradient(
          ellipse,
          rgba(216,180,254,0.18),
          transparent 70%
        );

      transform:
        rotate(45deg);

    }


    .orb {

      position: absolute;

      border-radius: 50%;

      filter: blur(2px);

      opacity: 0.25;

    }


    .orb.one {

      width: 180px;
      height: 180px;

      left: 5%;
      top: 35%;

      background: var(--purple);

      animation:
        floatOne 12s ease-in-out infinite;

    }


    .orb.two {

      width: 240px;
      height: 240px;

      right: 2%;
      top: 55%;

      background: var(--violet);

      animation:
        floatTwo 14s ease-in-out infinite;

    }


    @keyframes bloomPulse {

      0%,100% {

        transform:
          translate(-50%,-50%)
          scale(0.85);

        opacity: 0.35;

      }

      50% {

        transform:
          translate(-50%,-50%)
          scale(1.25);

        opacity: 0.65;

      }

    }


    @keyframes floatOne {

      0%,100% {
        transform: translate(0,0);
      }

      50% {
        transform: translate(70px,-60px);
      }

    }


    @keyframes floatTwo {

      0%,100% {
        transform: translate(0,0);
      }

      50% {
        transform: translate(-80px,70px);
      }

    }
